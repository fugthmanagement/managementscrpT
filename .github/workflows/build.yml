name: FUGTH Web Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test FUGTH account number allocation
        run: node --experimental-default-type=module --test tests/account-number.test.mjs
      - name: Test spoken Call Training simulator
        run: node --experimental-default-type=module --test tests/call-training.test.mjs
      - name: Test business-only RAG filters and tenant isolation
        run: node --experimental-default-type=module --test tests/business-agent-rag.test.mjs
      - name: Test Firestore founder calendar time slots
        run: node --experimental-default-type=module --test tests/founder-calendar.test.mjs
      - name: Test public booking owner and confirmation safety
        run: node --experimental-default-type=module --test tests/founder-booking-owner.test.mjs tests/founder-booking-contract.test.mjs
      - name: Test unified FUGTH agent and automatic GGUF model routing
        run: node --experimental-default-type=module --test tests/fugth-business-agent.test.mjs
      - name: Test Site Maker tool safeguards and licensed image matching
        run: node --experimental-default-type=module --test tests/site-maker-tools.test.mjs
      - name: Test saved-demo recovery
        run: node --experimental-default-type=module --test tests/prospect-demos-directory.test.mjs
      - name: Test one-prospect one-link workflow
        run: node --experimental-default-type=module --test tests/prospect-workflow.test.mjs
      - name: Test independent manual SMS tracking
        run: node --experimental-default-type=module --test tests/manual-sms-history.test.mjs
      - name: Test Firebase Admin project identity recovery
        run: node --experimental-default-type=module --test tests/firebase-project.test.mjs
      - name: Test Firebase Admin service-account secret format and safe diagnostics
        run: node --experimental-default-type=module --test tests/firebase-admin-credentials.test.mjs
      - name: Test website legal templates and preset chatbot facts
        run: node --experimental-default-type=module --test tests/site-legal-presets.test.mjs
      - name: Test safe customer account recovery at checkout
        run: node --experimental-default-type=module --test tests/checkout-account.test.mjs
      - name: Test multi-item service cart and payment verification
        run: node --experimental-default-type=module --test tests/services-cart.test.mjs
      - name: Test industry canvas, saved layouts and founder preview access
        run: node --experimental-default-type=module --test tests/site-canvas.test.mjs
      - name: Test procedural site engine, unified prospects and safe domain staging
        run: node --experimental-default-type=module --test tests/procedural-launch.test.mjs
      - name: Test iPhone outreach, opt-in safety and prospect event history
        run: node --experimental-default-type=module --test tests/iphone-outreach.test.mjs
      - name: Test Google Calendar-only customer onboarding and founder-only website/recording tools
        run: node --experimental-default-type=module --test tests/calendar-onboarding.test.mjs
      - name: Build FUGTH website
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: fugthmanagement-89c84
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: fugthmanagement-89c84.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_API_KEY: build_placeholder_only
        run: npm run build
